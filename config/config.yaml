# Configuración por defecto de futbol-extract (tarea 1.5.2 de la Suite de
# Implementación de Arquitectura). Cambiar estos valores cambia el
# comportamiento default de la CLI sin tocar ningún .py.

default_ligas:
  - "ENG-Premier League"
  - "ESP-La Liga"
  - "ITA-Serie A"
  - "GER-Bundesliga"
  - "FRA-Ligue 1"

default_temporadas:
  - "2425"
  - "2526"

data_dir: "data/raw"

# Caché de soccerdata (tarea 1.6.3). soccerdata guarda acá tanto los
# datos cacheados de sus lecturas (BASE_DIR/data) como su configuración
# custom (BASE_DIR/config) — ver SOCCERDATA_DIR en futbol/config.py.
# No se versiona (cubierto por el patrón "data/" de .gitignore).
cache_dir: "data/cache/soccerdata"

log_level: "INFO"
